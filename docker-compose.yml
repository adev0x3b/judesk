# Copy .env.example to .env and set DB_PASSWORD, then `docker compose up --build` and open
# http://localhost:${WEB_PORT:-8090}/setup with the setup code the api service prints in its log.
# Container logs are capped so a long-running demo does not fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: judesk
      POSTGRES_USER: judesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    volumes:
      - judesk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judesk -d judesk"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=judesk;Username=judesk;Password=${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      Seed__Demo: ${SEED_DEMO:-false}
      Schedule__TimeZone: ${TIME_ZONE:-Europe/Rome}
      # nginx is the only thing that can reach the api container, so its X-Forwarded-* headers are trusted.
      Proxy__TrustForwardedHeaders: "true"
      Proxy__ForwardLimit: ${PROXY_FORWARD_LIMIT:-1}
      Demo__Mode: ${DEMO_MODE:-false}
      Demo__ResetMinutes: ${DEMO_RESET_MINUTES:-60}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      DataProtection__KeysPath: /keys
    volumes:
      - judesk-keys:/keys
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    environment:
      TRUST_FORWARDED_PROTO: ${TRUST_FORWARDED_PROTO:-false}
    ports:
      # Loopback only by default; set WEB_BIND=0.0.0.0 to reach it from other machines.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  judesk-db:
  judesk-keys:
