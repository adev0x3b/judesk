# One command demo: `docker compose up --build`, then open http://localhost:${WEB_PORT:-8090}/setup
# and enter the setup code the api service prints in its log. No account is seeded.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: judesk
      POSTGRES_USER: judesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-judesk}
    volumes:
      - judesk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judesk -d judesk"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=judesk;Username=judesk;Password=${DB_PASSWORD:-judesk}
      Seed__Demo: ${SEED_DEMO:-true}
      # nginx is the only thing that can reach the api container, so its X-Forwarded-* headers are trusted.
      Proxy__TrustForwardedHeaders: "true"
      Proxy__ForwardLimit: ${PROXY_FORWARD_LIMIT:-1}
      Demo__Mode: ${DEMO_MODE:-false}
      Demo__ResetMinutes: ${DEMO_RESET_MINUTES:-60}
      DataProtection__KeysPath: /keys
    volumes:
      - judesk-keys:/keys
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Loopback only by default; set WEB_BIND=0.0.0.0 to reach it from other machines.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  judesk-db:
  judesk-keys:
