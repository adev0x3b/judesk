# One command demo: `docker compose up --build` then open http://localhost:${WEB_PORT:-8090}
# Sign in with the admin credentials below (override them in a .env file, see .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: judesk
      POSTGRES_USER: judesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-judesk}
    volumes:
      - judesk-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judesk -d judesk"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=judesk;Username=judesk;Password=${DB_PASSWORD:-judesk}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@judesk.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-ChangeMe123!}
      Seed__Demo: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  judesk-db:
