name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration on PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --report-xunit-trx --results-directory TestResults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend (lint, types, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build-only

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: judesk-ci
      WEB_PORT: "18090"
      DB_PASSWORD: ci-only-database-password
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test
        run: scripts/smoke.sh http://127.0.0.1:18090
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
