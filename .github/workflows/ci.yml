name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Runs on the self-hosted runner "zed" while the repo is private (see README > CI).
# Before the repo goes public: switch every `runs-on` to ubuntu-latest and remove the runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration on PostgreSQL)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend (lint, types, unit, build)
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build-only

  compose-smoke:
    name: Compose smoke test
    runs-on: [self-hosted, linux]
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: judesk-ci
      WEB_PORT: "18090"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Smoke test
        run: scripts/smoke.sh http://localhost:18090
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
